name: video_gallery_flutter
description: Macefo video gallery Flutter application.
publish_to: "none"
version: 1.0.8+107

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  animations: ^2.2.0
  http: ^1.6.0
  new_version_plus: ^1.0.1
  package_info_plus: ^9.0.1
  path_provider: ^2.1.6
  share_plus: ^12.0.2
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  youtube_player_flutter: ^9.1.3
  google_mobile_ads: ^9.0.0
  in_app_purchase: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/banner_macefo.png
    - assets/icon.png
    - assets/logo.png
